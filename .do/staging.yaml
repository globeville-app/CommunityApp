# STAGING: a second, private copy of the server for trying a release on real
# phones before members get it (review D5, README "Staging server"). Same as
# app.yaml except: it deploys the `staging` branch, has its own small
# database and its own Spaces folder, says STAGING in the admin, sends no real
# push notifications (PUSH_ENABLED=0), and has no daily cleanup job.
# Create it like the real one (Apps → Create App → "Import from app spec")
# and fill in every CHANGE_ME. Never reuse production's secrets here.
name: globeville-staging
region: sfo

# Emails to the account's team when something goes wrong (review O8). Check
# them under Settings → Alerts after the first deploy.
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

services:
  - name: api
    dockerfile_path: Dockerfile
    github:
      repo: globeville-app/CommunityApp
      branch: staging
      deploy_on_push: true
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /healthz
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 3
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 85
        window: TEN_MINUTES
    envs:
      - key: DJANGO_DEBUG
        value: "0"
      - key: APP_ENVIRONMENT
        value: staging
      - key: DJANGO_SECRET_KEY
        type: SECRET
        value: CHANGE_ME
      - key: ALLOWED_HOSTS
        value: api-staging.globeville.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://api-staging.globeville.app
      - key: ADMIN_URL
        type: SECRET
        value: CHANGE_ME/
      # Where the caller's real address comes from, for rate limits
      # (backend/config/throttling.py). Check it after the first deploy.
      - key: CLIENT_IP_HEADER
        value: DO-Connecting-IP
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}
      - key: SPACES_BUCKET
        value: CHANGE_ME
      - key: SPACES_ENDPOINT
        value: https://sfo3.digitaloceanspaces.com
      - key: SPACES_REGION
        value: sfo3
      - key: SPACES_KEY
        type: SECRET
        value: CHANGE_ME
      - key: SPACES_SECRET
        type: SECRET
        value: CHANGE_ME
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.postmarkapp.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        type: SECRET
        value: CHANGE_ME
      - key: EMAIL_HOST_PASSWORD
        type: SECRET
        value: CHANGE_ME
      - key: DEFAULT_FROM_EMAIL
        value: globeville <hello@globeville.app>
      - key: PROBLEM_REPORT_EMAILS
        type: SECRET
        value: CHANGE_ME
      # Who gets a short email when the server crashes (backend/config/alerts.py).
      - key: SERVER_ERROR_EMAILS
        type: SECRET
        value: CHANGE_ME
      # Staging never buzzes phones; set to "1" to try push on your own phone.
      - key: PUSH_ENABLED
        value: "0"
    domains:
      - domain: api-staging.globeville.app
        type: PRIMARY

jobs:
  # Runs before every deploy: database changes, the table the rate limits
  # are counted in, then the neighborhood map (all safe to repeat; the map
  # updates the 78 neighborhoods in place).
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: Dockerfile
    github:
      repo: globeville-app/CommunityApp
      branch: staging
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: sh -c "python manage.py migrate --noinput && python manage.py createcachetable && python manage.py load_neighborhoods"
    envs:
      - key: DJANGO_DEBUG
        value: "0"
      - key: APP_ENVIRONMENT
        value: staging
      - key: DJANGO_SECRET_KEY
        type: SECRET
        value: CHANGE_ME
      - key: ALLOWED_HOSTS
        value: api-staging.globeville.app
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}

  # Every 15 minutes: send event reminders and any cancellation notices
  # that couldn't go out right away (docs/MILESTONE_4.md), and credit hosts
  # for events that have ended. Safe to run twice.
  - name: send-notifications
    kind: SCHEDULED
    schedule:
      cron: "*/15 * * * *"
      time_zone: America/Denver
    dockerfile_path: Dockerfile
    github:
      repo: globeville-app/CommunityApp
      branch: staging
    instance_size_slug: apps-s-1vcpu-0.5gb
    # Then credit hosts for events that ended with 2+ neighbors checked in.
    run_command: sh -c "python manage.py send_due_notifications; python manage.py count_hosted_events"
    envs:
      - key: DJANGO_DEBUG
        value: "0"
      - key: APP_ENVIRONMENT
        value: staging
      - key: DJANGO_SECRET_KEY
        type: SECRET
        value: CHANGE_ME
      - key: ALLOWED_HOSTS
        value: api-staging.globeville.app
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}
      - key: PUSH_ENABLED
        value: "0"

databases:
  - name: db
    engine: PG
    version: "16"
    # A small development database is enough for testers (and much cheaper).
    production: false
