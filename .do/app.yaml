# DigitalOcean App Platform spec (docs/GO_LIVE.md §2, README "Going live").
#
# The settings at the top (`envs`) are shared by the website and all three
# jobs, so each secret is typed in ONCE. Only these six need filling in, in
# the dashboard (Settings → App-Level Environment Variables), never in this
# file: DJANGO_SECRET_KEY, ADMIN_URL, SPACES_KEY, SPACES_SECRET,
# EMAIL_HOST_USER and EMAIL_HOST_PASSWORD (both the Postmark server token).
# The ones left blank below are for later steps; each says when.
#
# The database is a managed PostgreSQL cluster created first, named
# globeville-db (README, "3. The app").
name: globeville-app
region: sfo

# Emails to the account's team when something goes wrong (review O8). Check
# them under Settings → Alerts after the first deploy.
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

envs:
  - key: DJANGO_DEBUG
    value: "0"
  # 60+ random characters, e.g. from a password manager's generator.
  - key: DJANGO_SECRET_KEY
    type: SECRET
    value: CHANGE_ME
  # globeville.org serves the invite-link and legal pages (Milestone 5).
  - key: ALLOWED_HOSTS
    value: api.globeville.org,globeville.org
  - key: CSRF_TRUSTED_ORIGINS
    value: https://api.globeville.org,https://globeville.org
  - key: PUBLIC_BASE_URL
    value: https://globeville.org
  # A path only the team knows, ending in "/", e.g. team-7f3k/.
  - key: ADMIN_URL
    type: SECRET
    value: CHANGE_ME/
  # Where the caller's real address comes from, for rate limits
  # (backend/config/throttling.py). Check it after the first deploy.
  - key: CLIENT_IP_HEADER
    value: DO-Connecting-IP
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${db.DATABASE_URL}

  # Photos and screenshots: the private Spaces bucket.
  - key: SPACES_BUCKET
    value: globeville-media
  - key: SPACES_ENDPOINT
    value: https://sfo3.digitaloceanspaces.com
  - key: SPACES_REGION
    value: sfo3
  - key: SPACES_KEY
    type: SECRET
    value: CHANGE_ME
  - key: SPACES_SECRET
    type: SECRET
    value: CHANGE_ME

  # Email through Postmark: the server API token goes in BOTH settings.
  - key: EMAIL_BACKEND
    value: django.core.mail.backends.smtp.EmailBackend
  - key: EMAIL_HOST
    value: smtp.postmarkapp.com
  - key: EMAIL_PORT
    value: "587"
  - key: EMAIL_HOST_USER
    type: SECRET
    value: CHANGE_ME
  - key: EMAIL_HOST_PASSWORD
    type: SECRET
    value: CHANGE_ME
  - key: DEFAULT_FROM_EMAIL
    value: globeville <info@globeville.org>
  # Who gets problem reports, budget alerts and crash notices.
  - key: PROBLEM_REPORT_EMAILS
    value: info@globeville.org
  - key: OWNER_ALERT_EMAILS
    value: info@globeville.org
  - key: SERVER_ERROR_EMAILS
    value: info@globeville.org
  - key: SUPPORT_EMAIL
    value: info@globeville.org

  # Texting guests (Milestone 5.2). SMS_LIVE stays "0" until the carrier
  # registration and the legal review are done (docs/MILESTONE_5.md); the
  # Twilio settings are filled in then, as encrypted values.
  - key: SMS_LIVE
    value: "0"
  - key: TWILIO_ACCOUNT_SID
    value: ""
  - key: TWILIO_AUTH_TOKEN
    value: ""
  - key: SMS_MESSAGING_SERVICE_ID
    value: ""
  - key: SMS_MONTHLY_BUDGET_USD
    value: "50"
  - key: SMS_COST_PER_TEXT_USD
    value: "0.01"

  # Links that open the app (Milestone 5): fill in once Apple approves the
  # developer account (Membership → Team ID) and after the first Android
  # build (`npx eas credentials` → SHA-256 fingerprint).
  - key: APPLE_TEAM_ID
    value: ""
  - key: ANDROID_CERT_SHA256
    value: ""
  # Optional: Expo account → Access tokens, for push notifications
  # (README, "Push notifications"). Add as an encrypted value.
  - key: EXPO_ACCESS_TOKEN
    value: ""

services:
  - name: api
    dockerfile_path: Dockerfile
    github:
      repo: globeville-app/CommunityApp
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /healthz
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 3
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 85
        window: TEN_MINUTES
    domains:
      - domain: api.globeville.org
        type: PRIMARY
      # The invite-link pages, the legal pages and the deep-link files.
      - domain: globeville.org
        type: ALIAS

jobs:
  # Runs before every deploy: database changes, the table the rate limits
  # are counted in, then the neighborhood map (all safe to repeat; the map
  # updates the 78 neighborhoods in place).
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: Dockerfile
    github:
      repo: globeville-app/CommunityApp
      branch: main
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: sh -c "python manage.py migrate --noinput && python manage.py createcachetable && python manage.py load_neighborhoods"

  # Every 15 minutes: send event reminders and any cancellation notices
  # that couldn't go out right away (docs/MILESTONE_4.md), guest texts when
  # they're on, and credit hosts for events that have ended. Safe to run twice.
  - name: send-notifications
    kind: SCHEDULED
    schedule:
      cron: "*/15 * * * *"
      time_zone: America/Denver
    dockerfile_path: Dockerfile
    github:
      repo: globeville-app/CommunityApp
      branch: main
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: sh -c "python manage.py send_due_notifications; python manage.py count_hosted_events"

  # Once a day: delete what has done its job (backend/accounts/retention.py
  # lists every rule, e.g. problem reports after a year).
  - name: cleanup-old-data
    kind: SCHEDULED
    schedule:
      cron: "17 3 * * *"
      time_zone: America/Denver
    dockerfile_path: Dockerfile
    github:
      repo: globeville-app/CommunityApp
      branch: main
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: python manage.py cleanup_old_data

databases:
  # A managed PostgreSQL 16 cluster with daily backups, created BEFORE the
  # app (Databases → Create, region SFO3, named exactly globeville-db).
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: globeville-db
